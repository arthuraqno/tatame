services:
  user-db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: user_db
    ports:
      - "5433:5432"
    volumes:
      - user_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  user-service:
    build: ./user-service
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD}@user-db:5432/user_db
    volumes:
      - ./user-service/private_key.pem:/app/private_key.pem:ro
      - ./user-service/public_key.pem:/app/public_key.pem:ro
    ports:
      - "8001:8000"
    depends_on:
      user-db:
        condition: service_healthy
  
  product-db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: product_db
    ports:
      - "5434:5432"
    volumes:
      - product_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  product-service:
    build: ./product-service
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD}@product-db:5432/product_db
    volumes:
      - ./product-service/public_key.pem:/app/public_key.pem:ro
    ports:
      - "8002:8000"
    depends_on:
      product-db:
        condition: service_healthy
  
  cart-redis:
    image: redis:7
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6380:6379"
    volumes:
      - cart_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    
  cart-service:
    build: ./cart-service
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@cart-redis:6379/0
      PRODUCT_SERVICE_URL: http://product-service:8000
    volumes:
      - ./cart-service/public_key.pem:/app/public_key.pem:ro
    ports:
      - "8003:8000"
    depends_on:
      cart-redis:
        condition: service_healthy

  order-db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: order_db
    ports:
      - "5435:5432"
    volumes:
      - order_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  order-service:
    build: ./order-service
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD}@order-db:5432/order_db
      CART_SERVICE_URL: http://cart-service:8000
    volumes:
      - ./order-service/public_key.pem:/app/public_key.pem:ro
    ports:
      - "8004:8000"
    depends_on:
      order-db:
        condition: service_healthy
  
  payment-db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PAYMENT_DB_PASSWORD}
      POSTGRES_DB: payment_db
    ports:
      - "5436:5432"
    volumes:
      - payment_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      
  payment-service:
    build: ./payment-service
    env_file:
      - ./payment-service/.env
    environment:
      DATABASE_URL: postgresql://postgres:${PAYMENT_DB_PASSWORD}@payment-db:5432/payment_db
      ORDER_SERVICE_URL: http://order-service:8000
    volumes:
      - ./payment-service/public_key.pem:/app/public_key.pem:ro
    ports:
      - "8005:8000"
    depends_on:
      payment-db:
        condition: service_healthy
        
volumes:
  user_pgdata:
  product_pgdata:
  cart_redisdata:
  order_pgdata:
  payment_pgdata: