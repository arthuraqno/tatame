<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3c4043"/>
    </marker>
    <marker id="seta-evento" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e8710a"/>
    </marker>
  </defs>

  <!-- fundo claro, para ficar legível no tema claro e no escuro do GitHub -->
  <rect x="0" y="0" width="1200" height="840" rx="16" fill="#ffffff" stroke="#dadce0"/>
  <text x="40" y="34" font-size="19" font-weight="700" fill="#202124">Tatame · arquitetura de microsserviços</text>

  <!-- ===== linha 1: cliente e serviços externos ===== -->
  <rect x="45" y="55" width="150" height="50" rx="10" fill="#f3e8fd" stroke="#8430ce" stroke-width="1.5"/>
  <text x="120" y="77" text-anchor="middle" font-size="14" font-weight="700" fill="#202124">GitHub</text>
  <text x="120" y="95" text-anchor="middle" font-size="12" fill="#5f6368">login social (OAuth2)</text>

  <rect x="520" y="55" width="160" height="50" rx="10" fill="#fef7e0" stroke="#b06000" stroke-width="1.5"/>
  <text x="600" y="77" text-anchor="middle" font-size="14" font-weight="700" fill="#202124">Cliente</text>
  <text x="600" y="95" text-anchor="middle" font-size="12" fill="#5f6368">Swagger · navegador</text>

  <rect x="1005" y="55" width="150" height="50" rx="10" fill="#f3e8fd" stroke="#8430ce" stroke-width="1.5"/>
  <text x="1080" y="77" text-anchor="middle" font-size="14" font-weight="700" fill="#202124">Stripe</text>
  <text x="1080" y="95" text-anchor="middle" font-size="12" fill="#5f6368">pagamento (modo teste)</text>

  <!-- cliente chama cada serviço pela porta dele -->
  <line x1="600" y1="105" x2="600" y2="150" stroke="#3c4043" stroke-width="1.6"/>
  <text x="608" y="133" font-size="11" fill="#5f6368">HTTP + JWT</text>
  <line x1="120" y1="150" x2="1080" y2="150" stroke="#3c4043" stroke-width="1.6"/>
  <line x1="120" y1="150" x2="120" y2="188" stroke="#3c4043" stroke-width="1.6" marker-end="url(#seta)"/>
  <line x1="360" y1="150" x2="360" y2="188" stroke="#3c4043" stroke-width="1.6" marker-end="url(#seta)"/>
  <line x1="600" y1="150" x2="600" y2="188" stroke="#3c4043" stroke-width="1.6" marker-end="url(#seta)"/>
  <line x1="840" y1="150" x2="840" y2="188" stroke="#3c4043" stroke-width="1.6" marker-end="url(#seta)"/>
  <line x1="1080" y1="150" x2="1080" y2="188" stroke="#3c4043" stroke-width="1.6" marker-end="url(#seta)"/>

  <!-- user-service <-> GitHub -->
  <line x1="70" y1="188" x2="70" y2="107" stroke="#3c4043" stroke-width="1.6" marker-end="url(#seta)"/>
  <text x="63" y="142" text-anchor="end" font-size="11" fill="#5f6368">login</text>
  <text x="63" y="155" text-anchor="end" font-size="11" fill="#5f6368">social</text>

  <!-- payment-service <-> Stripe -->
  <line x1="1110" y1="188" x2="1110" y2="107" stroke="#3c4043" stroke-width="1.6" marker-end="url(#seta)"/>
  <text x="1104" y="124" text-anchor="end" font-size="11" fill="#5f6368">cria o</text>
  <text x="1104" y="137" text-anchor="end" font-size="11" fill="#5f6368">checkout</text>
  <line x1="1140" y1="107" x2="1140" y2="188" stroke="#3c4043" stroke-width="1.6" marker-end="url(#seta)"/>
  <text x="1146" y="138" font-size="11" fill="#5f6368">webhook</text>
  <text x="1146" y="151" font-size="11" fill="#5f6368">assinado</text>

  <!-- ===== linha 2: serviços HTTP ===== -->
  <g font-size="12" fill="#5f6368">
    <rect x="45" y="190" width="150" height="70" rx="10" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
    <text x="120" y="219" text-anchor="middle" font-size="15" font-weight="700" fill="#202124">user-service</text>
    <text x="120" y="240" text-anchor="middle">FastAPI · :8001</text>

    <rect x="285" y="190" width="150" height="70" rx="10" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
    <text x="360" y="219" text-anchor="middle" font-size="15" font-weight="700" fill="#202124">product-service</text>
    <text x="360" y="240" text-anchor="middle">FastAPI · :8002</text>

    <rect x="525" y="190" width="150" height="70" rx="10" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
    <text x="600" y="219" text-anchor="middle" font-size="15" font-weight="700" fill="#202124">cart-service</text>
    <text x="600" y="240" text-anchor="middle">FastAPI · :8003</text>

    <rect x="765" y="190" width="150" height="70" rx="10" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
    <text x="840" y="219" text-anchor="middle" font-size="15" font-weight="700" fill="#202124">order-service</text>
    <text x="840" y="240" text-anchor="middle">FastAPI · :8004</text>

    <rect x="1005" y="190" width="150" height="70" rx="10" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
    <text x="1080" y="219" text-anchor="middle" font-size="15" font-weight="700" fill="#202124">payment-service</text>
    <text x="1080" y="240" text-anchor="middle">FastAPI · :8005</text>
  </g>

  <!-- chamadas HTTP entre serviços -->
  <line x1="523" y1="232" x2="437" y2="232" stroke="#3c4043" stroke-width="1.6" marker-end="url(#seta)"/>
  <text x="480" y="207" text-anchor="middle" font-size="11" fill="#5f6368">preço e</text>
  <text x="480" y="220" text-anchor="middle" font-size="11" fill="#5f6368">estoque</text>

  <line x1="763" y1="232" x2="677" y2="232" stroke="#3c4043" stroke-width="1.6" marker-end="url(#seta)"/>
  <text x="720" y="207" text-anchor="middle" font-size="11" fill="#5f6368">lê e esvazia</text>
  <text x="720" y="220" text-anchor="middle" font-size="11" fill="#5f6368">o carrinho</text>

  <line x1="1003" y1="232" x2="917" y2="232" stroke="#3c4043" stroke-width="1.6" marker-end="url(#seta)"/>
  <text x="960" y="207" text-anchor="middle" font-size="11" fill="#5f6368">consulta</text>
  <text x="960" y="220" text-anchor="middle" font-size="11" fill="#5f6368">o pedido</text>

  <!-- ===== linha 3: armazenamento de cada serviço ===== -->
  <g stroke="#9aa0a6" stroke-width="1.4">
    <line x1="105" y1="260" x2="105" y2="290"/>
    <line x1="345" y1="260" x2="345" y2="290"/>
    <line x1="585" y1="260" x2="585" y2="290"/>
    <line x1="825" y1="260" x2="825" y2="290"/>
    <line x1="1065" y1="260" x2="1065" y2="290"/>
  </g>
  <g font-size="12" fill="#5f6368">
    <rect x="45" y="290" width="120" height="80" rx="8" fill="#f1f3f4" stroke="#9aa0a6"/>
    <text x="105" y="309" text-anchor="middle" font-weight="700" fill="#202124">PostgreSQL</text>
    <text x="105" y="324" text-anchor="middle">user_db</text>
    <text x="105" y="344" text-anchor="middle" font-weight="700" fill="#202124">Redis</text>
    <text x="105" y="359" text-anchor="middle">rate limit · state</text>

    <rect x="285" y="290" width="120" height="44" rx="8" fill="#f1f3f4" stroke="#9aa0a6"/>
    <text x="345" y="309" text-anchor="middle" font-weight="700" fill="#202124">PostgreSQL</text>
    <text x="345" y="325" text-anchor="middle">product_db</text>

    <rect x="525" y="290" width="120" height="44" rx="8" fill="#f1f3f4" stroke="#9aa0a6"/>
    <text x="585" y="309" text-anchor="middle" font-weight="700" fill="#202124">Redis</text>
    <text x="585" y="325" text-anchor="middle">carrinho</text>

    <rect x="765" y="290" width="120" height="44" rx="8" fill="#f1f3f4" stroke="#9aa0a6"/>
    <text x="825" y="309" text-anchor="middle" font-weight="700" fill="#202124">PostgreSQL</text>
    <text x="825" y="325" text-anchor="middle">order_db</text>

    <rect x="1005" y="290" width="120" height="44" rx="8" fill="#f1f3f4" stroke="#9aa0a6"/>
    <text x="1065" y="309" text-anchor="middle" font-weight="700" fill="#202124">PostgreSQL</text>
    <text x="1065" y="325" text-anchor="middle">payment_db</text>
  </g>

  <!-- eventos publicados pelos serviços HTTP -->
  <line x1="180" y1="260" x2="180" y2="466" stroke="#e8710a" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#seta-evento)"/>
  <text x="188" y="425" font-size="12" font-weight="600" fill="#b06000">usuario.criado</text>

  <line x1="1140" y1="260" x2="1140" y2="466" stroke="#e8710a" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#seta-evento)"/>
  <text x="1132" y="425" text-anchor="end" font-size="12" font-weight="600" fill="#b06000">pagamento.confirmado</text>

  <!-- ===== linha 4: RabbitMQ ===== -->
  <rect x="45" y="470" width="1110" height="52" rx="10" fill="#fef3e8" stroke="#e8710a" stroke-width="1.8"/>
  <text x="600" y="493" text-anchor="middle" font-size="15" font-weight="700" fill="#202124">RabbitMQ · exchange tatame.eventos (topic)</text>
  <text x="600" y="512" text-anchor="middle" font-size="12" fill="#5f6368">uma fila durável por consumidor · mensagens persistentes · confirmação (ack) só depois do trabalho feito</text>

  <!-- eventos entregues aos consumidores -->
  <line x1="320" y1="522" x2="320" y2="598" stroke="#e8710a" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#seta-evento)"/>
  <text x="328" y="565" font-size="12" font-weight="600" fill="#b06000">pedido.pago</text>

  <line x1="545" y1="522" x2="545" y2="598" stroke="#e8710a" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#seta-evento)"/>
  <text x="553" y="556" font-size="12" font-weight="600" fill="#b06000">usuario.criado</text>
  <text x="553" y="571" font-size="12" font-weight="600" fill="#b06000">pedido.pago</text>

  <line x1="800" y1="522" x2="800" y2="598" stroke="#e8710a" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#seta-evento)"/>
  <text x="792" y="565" text-anchor="end" font-size="12" font-weight="600" fill="#b06000">pagamento.confirmado</text>

  <line x1="880" y1="598" x2="880" y2="524" stroke="#e8710a" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#seta-evento)"/>
  <text x="888" y="565" font-size="12" font-weight="600" fill="#b06000">pedido.pago</text>

  <!-- ===== linha 5: consumidores ===== -->
  <g font-size="12" fill="#5f6368">
    <rect x="275" y="600" width="170" height="78" rx="10" fill="#e6f4ea" stroke="#188038" stroke-width="1.5"/>
    <text x="360" y="623" text-anchor="middle" font-size="14" font-weight="700" fill="#202124">product-consumer</text>
    <text x="360" y="643" text-anchor="middle">baixa o estoque</text>
    <text x="360" y="660" text-anchor="middle">em product_db</text>

    <rect x="515" y="600" width="170" height="78" rx="10" fill="#e6f4ea" stroke="#188038" stroke-width="1.5"/>
    <text x="600" y="623" text-anchor="middle" font-size="14" font-weight="700" fill="#202124">notification-service</text>
    <text x="600" y="643" text-anchor="middle">guarda contatos</text>
    <text x="600" y="660" text-anchor="middle">monta o e-mail</text>

    <rect x="755" y="600" width="170" height="78" rx="10" fill="#e6f4ea" stroke="#188038" stroke-width="1.5"/>
    <text x="840" y="623" text-anchor="middle" font-size="14" font-weight="700" fill="#202124">order-consumer</text>
    <text x="840" y="643" text-anchor="middle">marca o pedido pago</text>
    <text x="840" y="660" text-anchor="middle">em order_db</text>
  </g>

  <line x1="600" y1="678" x2="600" y2="705" stroke="#9aa0a6" stroke-width="1.4"/>
  <rect x="540" y="705" width="120" height="44" rx="8" fill="#f1f3f4" stroke="#9aa0a6"/>
  <text x="600" y="724" text-anchor="middle" font-size="12" font-weight="700" fill="#202124">PostgreSQL</text>
  <text x="600" y="740" text-anchor="middle" font-size="12" fill="#5f6368">notification_db</text>

  <!-- ===== legenda ===== -->
  <line x1="45" y1="790" x2="1155" y2="790" stroke="#e8eaed"/>
  <line x1="60" y1="815" x2="110" y2="815" stroke="#3c4043" stroke-width="1.6" marker-end="url(#seta)"/>
  <text x="120" y="819" font-size="13" fill="#3c4043">chamada HTTP síncrona</text>

  <line x1="330" y1="815" x2="380" y2="815" stroke="#e8710a" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#seta-evento)"/>
  <text x="390" y="819" font-size="13" fill="#3c4043">evento assíncrono (RabbitMQ)</text>

  <line x1="640" y1="815" x2="690" y2="815" stroke="#9aa0a6" stroke-width="1.4"/>
  <text x="700" y="819" font-size="13" fill="#3c4043">armazenamento próprio do serviço</text>

  <rect x="950" y="806" width="18" height="18" rx="4" fill="#e6f4ea" stroke="#188038"/>
  <text x="976" y="819" font-size="13" fill="#3c4043">consumidor (sem API)</text>
</svg>
