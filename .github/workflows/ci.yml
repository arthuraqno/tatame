name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validar-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Criar arquivos .env vazios
        run: touch payment-service/.env user-service/.env
      - name: Validar docker-compose.yml
        run: docker compose config --quiet
        env:
          DB_PASSWORD: ci
          REDIS_PASSWORD: ci
          PAYMENT_DB_PASSWORD: ci
          NOTIFICATION_DB_PASSWORD: ci
          RABBITMQ_USER: ci
          RABBITMQ_PASSWORD: ci

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        servico:
          - user-service
          - product-service
          - cart-service
          - order-service
          - payment-service
          - notification-service
    steps:
      - uses: actions/checkout@v6
      - name: Construir a imagem de ${{ matrix.servico }}
        run: docker build -t tatame-${{ matrix.servico }} ./${{ matrix.servico }}